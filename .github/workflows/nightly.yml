name: Nightly Reliability

on:
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.7'
          cache: true
      - run: go mod verify
      - name: Run bounded fuzz targets
        env:
          KIRO_DEV_FUZZ_TIME: 20s
        run: bash scripts/dev-test.sh fuzz
