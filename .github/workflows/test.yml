name: Test

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod verify
      - run: go test -shuffle=on -timeout=10m ./...
      - run: go vet ./...
      - run: go build ./...
      - run: test -z "$(gofmt -l .)"
      - run: bash -n scripts/*.sh
      - run: node --check web/app.js
      - run: node --check web/credential-import.js
      - run: node scripts/credential-import.test.js
      - run: docker compose config --quiet

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test -race -shuffle=on -timeout=20m ./...

  test-386:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: GOARCH=386 go test -shuffle=on -timeout=10m ./proxy ./config ./pool ./internal/httpbody

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
